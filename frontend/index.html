<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Panel de WhatsFlow AI: tu empleado digital de WhatsApp." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Inter se sirve desde este mismo origen (ver el @font-face de tokens.css).
      El `preload` la pide en paralelo con el CSS en vez de esperar a que el
      navegador descubra la regla; `crossorigin` es obligatorio incluso siendo
      del mismo origen, porque las fuentes siempre se piden en modo CORS y sin
      él el navegador descargaría el archivo dos veces.
    -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>WhatsFlow AI — Panel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
